name: Update tick data

# Refreshes the dataset every Monday ~03:00 UTC: re-downloads the two most
# recent weeks (late-arriving ticks) and appends any new weeks.
# Can also be triggered manually from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas matplotlib

      - name: Refresh data (trailing weeks + new weeks)
        run: python scripts/update_data.py

      - name: Verify data integrity
        run: python scripts/verify_data.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data DATA_STATUS.json charts
          git commit -m "data: weekly refresh through $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
